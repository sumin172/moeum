spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5432/moeum
    username: moeum
    password: moeum
    hikari:
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 10000
  # 개발용 테스트 콘솔(tools/test-console)을 저장소 파일에서 직접 제공한다. jar에는 포함되지 않는다.
  # 실행 위치가 저장소 루트(IntelliJ)이거나 apps/backend/bootstrap(Gradle bootRun)인 경우를 모두 찾는다.
  web:
    resources:
      static-locations: file:tools/test-console/, file:../../../tools/test-console/
  mvc:
    static-path-pattern: /test-console/**

moeum:
  auth:
    session:
      # 로컬 전용. 운영에서는 MOEUM_AUTH_SESSION_SIGNINGSECRET로 별도 키를 주입한다.
      signing-secret: local-dev-only-refresh-signing-secret-32-bytes-min
  jwt:
    # 로컬 개발 전용 시크릿. 운영 환경에서는 환경변수/시크릿 매니저로 주입한다.
    secret: local-dev-only-jwt-secret-key-must-be-32-bytes-min
    expiration-seconds: 900
  google:
    # Google Cloud Console에서 발급받은 OAuth Client ID(콤마 구분, 웹/Android/iOS 등 여러 개 등록 가능)
    client-ids: ${GOOGLE_OAUTH_CLIENT_IDS:116753834711-vn81v2sooa2q45d4tdg444l26mmcbeam.apps.googleusercontent.com}
