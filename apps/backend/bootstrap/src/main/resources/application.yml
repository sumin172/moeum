spring:
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  threads:
    virtual:
      enabled: true

server:
  port: 8080
  tomcat:
    connection-timeout: 15s
    keep-alive-timeout: 5s

logging:
  level:
    com.moeum: DEBUG

resilience4j:
  circuitbreaker:
    configs:
      llm:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        recordExceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.HttpClientErrorException.TooManyRequests
          # 응답 본문이 비었거나 content가 없는 경우(안전 필터 등)
          - com.moeum.platform.llm.LlmException
    # 서킷은 용도가 아니라 provider 단위다 — 같은 provider를 쓰는 대화 응답과 일기 생성이 함께 빠르게 실패한다.
    instances:
      llm-gemini:
        baseConfig: llm
      llm-claude:
        baseConfig: llm

moeum:
  worker:
    # false면 이 인스턴스는 스케줄러(AI 응답 작업 poller, 일기 Planner/Executor)를 돌리지 않는다.
    # API 전용 인스턴스와 워커 인스턴스를 같은 jar로 나눠 띄우기 위한 스위치.
    enabled: true
  conversation:
    ai:
      daily-message-limit: 20
    # AI 응답 생성 작업 재시도/리스 정책 (기본값은 ResponseJobProperties 참고)
    response-job:
      max-attempts: 3
      backoff: 10s, 60s
      lease: 2m
      poll-interval: PT10S
  journal:
    # 일기 생성 작업 재시도/리스 정책 (기본값은 GenerationJobProperties 참고)
    generation-job:
      max-attempts: 5
      backoff: 1m, 5m, 30m, 2h
      lease: 5m
  llm:
    # 용도별 provider·모델·토큰 상한. 모델 교체나 provider 전환(예: 일기를 Claude Haiku로)은 이 설정만 바꾼다.
    # Gemini 모델 alias는 구세대가 조기 폐기되는 경우가 있어(2026-08-08 gemini-2.5-flash 404) latest alias를 쓴다.
    routes:
      conversation-response:
        provider: gemini
        model: gemini-flash-latest
        # 일상 반응은 짧게(비용 제어). Gemini 2.5+는 thinking 토큰도 이 상한에 포함되므로 thinking을 끈다.
        max-output-tokens: 150
        thinking-budget: 0
      journal-generation:
        # 목표는 Claude Haiku(claude-haiku-4-5-20251001)지만 결제 설정 전까지 Gemini를 쓴다
        provider: gemini
        model: gemini-flash-latest
        max-output-tokens: 2000
    # provider별 동시 호출 상한(bulkhead)
    max-concurrent-calls:
      gemini: 20
      claude: 10
    acquire-timeout: 5s
