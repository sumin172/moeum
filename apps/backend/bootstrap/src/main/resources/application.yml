spring:
  datasource:
    hikari:
      maximum-pool-size: ${API_DB_POOL_SIZE:10}
      minimum-idle: 2
      pool-name: api-db
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jmx:
    enabled: true
    unique-names: true
  threads:
    virtual:
      enabled: true

server:
  port: 8080
  tomcat:
    connection-timeout: 15s
    keep-alive-timeout: 5s

management:
  endpoints:
    web:
      exposure:
        exclude: "*"
    jmx:
      exposure:
        include: health,metrics

logging:
  structured:
    format:
      console: logstash
  level:
    com.moeum: INFO
    # PostgreSQL 오류 DETAIL은 실패한 행의 본문을 포함할 수 있다. 업무 경로에서 SQLSTATE/위치만 기록한다.
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: OFF
    org.hibernate.orm.jdbc.error: OFF

resilience4j:
  circuitbreaker:
    configs:
      llm:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        recordExceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.HttpClientErrorException.TooManyRequests
          # 역직렬화할 응답 본문이 없는 공급자 오류. 출력 잘림·차단 판정은 라우터에서 처리한다.
          - com.moeum.platform.llm.LlmException
    # 서킷은 각 워커 프로세스의 provider 단위다. 별도 역할 프로세스 간 상태는 공유하지 않는다.
    instances:
      llm-gemini:
        baseConfig: llm
      llm-claude:
        baseConfig: llm
      llm-cloudflare:
        baseConfig: llm

moeum:
  telemetry:
    buffer-capacity: 1024
    shutdown-timeout: 2s
  jobs:
    retention:
      terminal-age: 30d
      batch-size: 100
      interval: PT10S
      initial-delay: PT1M
  identity:
    conversation:
      # 확정된 현재 횟수. 무료·구독 모두 유한한 한도이며 설정으로 변경할 수 있다.
      free-record-limit: 20
      premium-record-limit: 100
  auth:
    session:
      # refresh token 수명(로그인·refresh 때마다 연장). access token 수명은 moeum.jwt.expiration-seconds(기본 15분)
      refresh-token-ttl: 30d
      # 교체된 직전 토큰이 이 시간 안에 다시 오면 탈취가 아니라 동시 요청으로 보고 세션을 유지한다
      rotation-grace: 30s
  runtime:
    roles: api
    conversation-concurrency: 8
    journal-concurrency: 2
    shutdown-timeout: 10s
  conversation:
    record-day:
      evening-start: "18:00"
      morning-end: "04:00"
      default-close-time: "02:00"
    # 사용자 메시지 길이·접수 속도 상한과 AI 문맥 실행 상한
    limits:
      max-message-length: 4000
      context-char-budget: 20000
      context-message-limit: 100
      accepted-messages-per-minute: 60
    # AI 응답 생성 작업 재시도/리스 정책 (기본값은 ResponseJobProperties 참고)
    response-job:
      max-attempts: 3
      backoff: 10s, 60s
      lease: 2m
      poll-interval: PT1S
  journal:
    # 일기 생성 작업 재시도/리스 정책 (기본값은 GenerationJobProperties 참고)
    generation-job:
      max-attempts: 5
      backoff: 1m, 5m, 30m, 2h
      lease: 5m
      poll-interval: PT1S
  cloudflare:
    account-id: ${CLOUDFLARE_ACCOUNT_ID:}
    api-token: ${CLOUDFLARE_API_TOKEN:}
  llm:
    # 용도별 provider·모델·토큰 상한. 모델 교체나 provider 전환(예: 일기를 Claude Haiku로)은 이 설정만 바꾼다.
    # 대화는 Cloudflare Qwen, 일기는 Gemini를 사용한다.
    routes:
      conversation-response:
        provider: cloudflare
        model: "@cf/qwen/qwen3-30b-a3b-fp8"
        # Qwen은 /no_think로 추론 억제를 요청한다. 강제 비활성화는 보장하지 않는다.
        max-output-tokens: 150
        thinking-budget: 0
      journal-generation:
        provider: gemini
        model: gemini-3.1-flash-lite
        max-output-tokens: 2000
    # provider별 동시 호출 상한(bulkhead)
    max-concurrent-calls:
      cloudflare: 8
      gemini: 20
      claude: 10
    acquire-timeout: 5s
